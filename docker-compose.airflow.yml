services:
  # ============================================================
  # PostgreSQL - Database Metadata Airflow
  # ============================================================
  postgres:
    image: postgres:16
    container_name: smart-logistics-airflow-postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
      - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  # ============================================================
  # Inisialisasi Airflow
  # ============================================================
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-logistics-airflow:3.3.2

    container_name: smart-logistics-airflow-init

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PROJECT_ID: ${PROJECT_ID}
      REGION: ${REGION}
      RAW_BUCKET: ${RAW_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      TEMP_BUCKET: ${TEMP_BUCKET}
      PYTHONPATH: /opt/airflow
      BMKG_URL_ID: ${BMKG_URL_ID}
      BMKG_URL_EN: ${BMKG_URL_EN}

      OPENAQ_TOPIC: ${OPENAQ_TOPIC}
      DRIVER_TOPIC: ${DRIVER_TOPIC}

      GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}

      # --------------------------------------------------------
      # Autentikasi
      # --------------------------------------------------------
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

      # --------------------------------------------------------
      # Autentikasi Email Alert Airflow
      # --------------------------------------------------------

      AIRFLOW__EMAIL__EMAIL_BACKEND: ${AIRFLOW__EMAIL__EMAIL_BACKEND}
      AIRFLOW_CONN_SMTP_DEFAULT: ${AIRFLOW_CONN_SMTP_DEFAULT}
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${AIRFLOW__SMTP__SMTP_STARTTLS}
      AIRFLOW__SMTP__SMTP_SSL: ${AIRFLOW__SMTP__SMTP_SSL}
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW__SMTP__SMTP_MAIL_FROM}

      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
      # --------------------------------------------------------
      # Executor
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      # --------------------------------------------------------
      # Database Airflow
      # --------------------------------------------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      # --------------------------------------------------------
      # API Eksekusi Airflow
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

      # --------------------------------------------------------
      # Umum
      # --------------------------------------------------------
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./schemas:/opt/airflow/schemas
      - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro

    command:
      - bash
      - -c
      - |
        airflow db migrate

    restart: "no"

  # ============================================================
  # Server API Airflow
  # ============================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-logistics-airflow:3.3.2

    container_name: smart-logistics-airflow-webserver

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

    environment:
      PROJECT_ID: ${PROJECT_ID}
      REGION: ${REGION}
      RAW_BUCKET: ${RAW_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      TEMP_BUCKET: ${TEMP_BUCKET}
      PYTHONPATH: /opt/airflow
      BMKG_URL_ID: ${BMKG_URL_ID}
      BMKG_URL_EN: ${BMKG_URL_EN}

      OPENAQ_TOPIC: ${OPENAQ_TOPIC}
      DRIVER_TOPIC: ${DRIVER_TOPIC}

      GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}

      # --------------------------------------------------------
      # Autentikasi
      # --------------------------------------------------------
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}

      # --------------------------------------------------------
      # Autentikasi Email Alert Airflow
      # --------------------------------------------------------

      AIRFLOW__EMAIL__EMAIL_BACKEND: ${AIRFLOW__EMAIL__EMAIL_BACKEND}
      AIRFLOW_CONN_SMTP_DEFAULT: ${AIRFLOW_CONN_SMTP_DEFAULT}
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${AIRFLOW__SMTP__SMTP_STARTTLS}
      AIRFLOW__SMTP__SMTP_SSL: ${AIRFLOW__SMTP__SMTP_SSL}
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW__SMTP__SMTP_MAIL_FROM}

      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
      # --------------------------------------------------------
      # Executor
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      # --------------------------------------------------------
      # API Eksekusi
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

      # --------------------------------------------------------
      # Umum
      # --------------------------------------------------------
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

      # --------------------------------------------------------
      # Konfigurasi Server API
      # --------------------------------------------------------
      AIRFLOW__API__HOST: "0.0.0.0"
      AIRFLOW__API__PORT: "8080"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./schemas:/opt/airflow/schemas
      - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro

    ports:
      - "8080:8080"

    command:
      - api-server

    restart: unless-stopped

  # ============================================================
  # Scheduler Airflow
  # ============================================================
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-logistics-airflow:3.3.2

    container_name: smart-logistics-airflow-scheduler

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      airflow-webserver:
        condition: service_started

    environment:
      PROJECT_ID: ${PROJECT_ID}
      REGION: ${REGION}
      RAW_BUCKET: ${RAW_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      TEMP_BUCKET: ${TEMP_BUCKET}

      BMKG_URL_ID: ${BMKG_URL_ID}
      BMKG_URL_EN: ${BMKG_URL_EN}
      PYTHONPATH: /opt/airflow
      OPENAQ_TOPIC: ${OPENAQ_TOPIC}
      DRIVER_TOPIC: ${DRIVER_TOPIC}

      GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}

      # --------------------------------------------------------
      # Autentikasi
      # --------------------------------------------------------
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      # --------------------------------------------------------
      # Autentikasi Email Alert Airflow
      # --------------------------------------------------------

      AIRFLOW__EMAIL__EMAIL_BACKEND: ${AIRFLOW__EMAIL__EMAIL_BACKEND}
      AIRFLOW_CONN_SMTP_DEFAULT: ${AIRFLOW_CONN_SMTP_DEFAULT}
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${AIRFLOW__SMTP__SMTP_STARTTLS}
      AIRFLOW__SMTP__SMTP_SSL: ${AIRFLOW__SMTP__SMTP_SSL}
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW__SMTP__SMTP_MAIL_FROM}

      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
      # --------------------------------------------------------
      # Executor
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      # --------------------------------------------------------
      # API Eksekusi
      #
      # Tasks execute inside the scheduler container.
      # Therefore localhost:8080 is NOT correct.
      #
      # airflow-webserver is the Docker service name.
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

      # --------------------------------------------------------
      # Umum
      # --------------------------------------------------------
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./schemas:/opt/airflow/schemas
      - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro

    command:
      - scheduler

    restart: unless-stopped

  # ============================================================
  # Airflow DAG Processor
  # ============================================================
  airflow-dag-processor:
    build:
      context: .
      dockerfile: Dockerfile
    image: smart-logistics-airflow:3.3.2

    container_name: smart-logistics-airflow-dag-processor

    depends_on:
      postgres:
        condition: service_healthy

      airflow-init:
        condition: service_completed_successfully

      airflow-webserver:
        condition: service_started

    environment:
      PROJECT_ID: ${PROJECT_ID}
      REGION: ${REGION}
      RAW_BUCKET: ${RAW_BUCKET}
      SILVER_BUCKET: ${SILVER_BUCKET}
      TEMP_BUCKET: ${TEMP_BUCKET}
      PYTHONPATH: /opt/airflow
      BMKG_URL_ID: ${BMKG_URL_ID}
      BMKG_URL_EN: ${BMKG_URL_EN}

      OPENAQ_TOPIC: ${OPENAQ_TOPIC}
      DRIVER_TOPIC: ${DRIVER_TOPIC}

      GOOGLE_APPLICATION_CREDENTIALS: /home/airflow/.config/gcloud/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}

      # --------------------------------------------------------
      # Autentikasi
      # --------------------------------------------------------
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
      # --------------------------------------------------------
      # Autentikasi Email Alert Airflow
      # --------------------------------------------------------

      AIRFLOW__EMAIL__EMAIL_BACKEND: ${AIRFLOW__EMAIL__EMAIL_BACKEND}
      AIRFLOW_CONN_SMTP_DEFAULT: ${AIRFLOW_CONN_SMTP_DEFAULT}
      AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
      AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
      AIRFLOW__SMTP__SMTP_STARTTLS: ${AIRFLOW__SMTP__SMTP_STARTTLS}
      AIRFLOW__SMTP__SMTP_SSL: ${AIRFLOW__SMTP__SMTP_SSL}
      AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
      AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
      AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW__SMTP__SMTP_MAIL_FROM}

      AIRFLOW_ALERT_EMAIL: ${AIRFLOW_ALERT_EMAIL}
      # --------------------------------------------------------
      # Executor
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

      # --------------------------------------------------------
      # API Eksekusi
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
      AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/

      # --------------------------------------------------------
      # Umum
      # --------------------------------------------------------
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./sql:/opt/airflow/sql
      - ./data:/opt/airflow/data
      - ./schemas:/opt/airflow/schemas
      - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro

    command:
      - dag-processor

    restart: unless-stopped

# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:
  airflow_postgres_data:
